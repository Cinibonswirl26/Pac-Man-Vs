# Fly.io config. Change `app` to your own app name (names are global), then `fly deploy`.
# Rooms live in memory, so keep one machine running at all times: a second machine would split the players,
# and a stopped one would drop every room.
app = "pacvs"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
