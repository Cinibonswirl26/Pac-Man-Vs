# Fly.io config. The GitHub Action (.github/workflows/fly.yml) deploys with `--app pacvs-<github user>`;
# by hand, pass `--app yourname` to `fly deploy` or add an `app = "..."` line here.
# Rooms live in memory, so keep one machine running at all times: a second machine would split the players,
# and a stopped one would drop every room.
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
