# Deploys the game server to Fly.io on every push of the pacvs folder, and on demand from the Actions tab.
# One-time setup: a Fly.io account, and its API token saved as the repository secret FLY_API_TOKEN.
# The app is called pacvs-<github user>; change FLY_APP below to pick another name.
name: Deploy to Fly.io
on:
  push:
    branches: [main, master, ccr-d5782d39-ohjnw8]
    paths: ['pacvs/**', '.github/workflows/fly.yml']
  workflow_dispatch:
concurrency: fly-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: pacvs } }
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: pacvs-${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check the token is set
        run: test -n "$FLY_API_TOKEN" || { echo "Add your Fly.io token as the repository secret FLY_API_TOKEN (see README)."; exit 1; }
      - name: Create the app if it does not exist yet
        run: |
          APP=$(echo "$FLY_APP" | tr 'A-Z' 'a-z')
          echo "FLY_APP=$APP" >> "$GITHUB_ENV"
          flyctl status --app "$APP" >/dev/null 2>&1 || flyctl apps create "$APP"
      - name: Deploy
        run: flyctl deploy --remote-only --app "$FLY_APP" --ha=false
      - name: Where it is
        run: echo "The game is at https://$FLY_APP.fly.dev"
