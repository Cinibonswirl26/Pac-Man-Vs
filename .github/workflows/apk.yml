# Builds the Android app (android/: a web view carrying the game's page files) and attaches the installable
# file to the run: Actions -> this run -> "PacManVs-apk". Nothing from any disc or cartridge goes in.
name: Android apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['client/**', 'shared/**', 'android/**', '.github/workflows/apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PacManVs.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PacManVs-apk
          path: PacManVs.apk
          retention-days: 90
